services:
  redis:
    image: redis:7-alpine
    restart: always

  base:
    build:
      context: .
      dockerfile: dockerfile
    image: base

  consumer:
    build:
      context: .
      dockerfile: apps/consumer/dockerfile
    env_file:
      - apps/consumer/.env.test
    volumes:
      - ./apps/consumer:/app/apps/consumer
      - ./libs:/app/libs
      - ./logs/consumer:/var/log/consumer
    ports:
      - ${CONSUMER_EXPOSED_PORT}:3000 # right-side port must be in sync with the PORT value in apps/consumer/.env
    depends_on:
      - base
      - redis
    command: sh -c "npm run test:int --detectOpenHandles > /var/log/consumer/integrationTests.log 2>&1"

  producer:
    build:
      context: .
      dockerfile: apps/producer/dockerfile
    env_file:
      - apps/producer/.env.test
    volumes:
      - ./apps/producer:/app/apps/producer
      - ./libs:/app/libs
      - ./logs/producer:/var/log/producer
    depends_on:
      - base
    command: sh -c "npm run test:int --detectOpenHandles > /var/log/producer/integrationTests.log 2>&1"
