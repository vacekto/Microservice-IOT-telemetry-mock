services:
  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PWD}

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis-data:/data

  base:
    build:
      context: .
      dockerfile: dockerfile
    image: base

  producer:
    build:
      context: .
      dockerfile: apps/producer/dockerfile
    volumes:
      - ./apps/producer:/app/apps/producer
      - ./node_modules:/app/node_modules
      - ./libs:/app/libs
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
    depends_on:
      - base
      - rabbitmq
    environment:
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PWD}@${RABBITMQ_HOST}:${RABBITMQ_PORT}
      - PORT=${PRODUCER_HTTP_PORT}
      - PRODUCER_ID=${PRODUCER_ID}

  consumer:
    build:
      context: .
      dockerfile: apps/consumer/dockerfile
    volumes:
      - ./apps/consumer:/app/apps/consumer
      - ./node_modules:/app/node_modules
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./libs:/app/libs
    depends_on:
      - base
      - rabbitmq
      - redis
    ports:
      - '${CONSUMER_HTTP_PORT}:3000'
    environment:
      - PORT=${CONSUMER_HTTP_PORT}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PWD}@${RABBITMQ_HOST}:${RABBITMQ_PORT}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}

volumes:
  redis-data:
